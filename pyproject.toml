[tool.poetry]
name = "job-bot"
version = "0.1.0"
description = "Reviews your PDF resume with Gemini, finds matching jobs, and applies for them."
authors = ["kwsweeney"]
readme = "README.md"
license = "MIT"
packages = [{ include = "job_bot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
google-genai = ">=1.0"
playwright = ">=1.40"
click = ">=8.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
job-bot = "job_bot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
